services:
  app:
    image: ${DOCKER_IMAGE:-backupmailer}:${IMAGE_TAG:-latest}
    container_name: backupmailer-${ENV_SUFFIX:-dev}
    restart: always
    env_file:
      - .env
    volumes:
      - ${BACKUP_PATH}:${BACKUP_PATH}
      - ./logs:/app/logs
    networks:
      - default
      - db

networks:
  # The database publishes no public port, so the container joins its
  # internal Docker network and reaches it by container hostname.
  db:
    external: true
    name: ${DB_NETWORK}
